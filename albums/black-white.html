      <h1>Black &amp; White</h1>
      <p class="album-subtitle">Light, shadow and texture</p>
      <div class="album-intro album-quote">
        <figure class="aq-item is-on">
          <blockquote><p>&ldquo;A picture is only a collection of brightnesses.&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
        <figure class="aq-item" aria-hidden="true">
          <blockquote><p>&ldquo;I can get&mdash;for me&mdash;a far greater sense of &lsquo;color&rsquo; through a well-planned and executed black-and-white image than I have ever achieved with color photography.&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
        <figure class="aq-item" aria-hidden="true">
          <blockquote><p>&ldquo;I prefer black and white because I&rsquo;m not obsessed with the dominating reality of color.&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
        <figure class="aq-item" aria-hidden="true">
          <blockquote><p>&ldquo;The negative is like the composer&rsquo;s score. The print is like the performance.&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
        <figure class="aq-item" aria-hidden="true">
          <blockquote><p>&ldquo;There is nothing worse than a sharp image of a fuzzy concept!&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
        <figure class="aq-item" aria-hidden="true">
          <blockquote><p>&ldquo;There are always two people in every picture: the photographer and the viewer.&rdquo;</p></blockquote>
          <figcaption>&mdash; Ansel Adams</figcaption>
        </figure>
      </div>
    </header>
