<body class="contact-page">
  <header class="site-header">
    <a class="site-title brand-lockup" href="index.html"><picture class="brand-wordmark-pic"><source type="image/webp" srcset="assets/brand/g4-fonts/header-lockup-dark-600.webp 600w, assets/brand/g4-fonts/header-lockup-dark-900.webp 900w" sizes="(max-width: 560px) 213px, (max-width: 960px) 250px, 314px"><img class="brand-wordmark brand-lockup-img" src="assets/brand/g4-fonts/header-lockup-dark-600.png" alt="Lantern &amp; Leaves Photography" width="600" height="260"></picture></a>
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="albums/black-white.html">Black &amp; White</a>
      <a href="albums/city-architecture.html">City &amp; Architecture</a>
      <a href="albums/landscapes.html">Landscapes</a>
      <a href="albums/nature.html">Nature</a>
      <a href="albums/portraits.html">Portraits</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <div class="contact-bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 700px)" type="image/webp" srcset="images/backgrounds/contact-forest-autumn-portrait.webp?v=1">
      <source media="(max-width: 700px)" srcset="images/backgrounds/contact-forest-autumn-portrait.jpg?v=1">
      <source type="image/webp" srcset="images/backgrounds/contact-forest-autumn.webp?v=1">
      <img src="images/backgrounds/contact-forest-autumn.jpg?v=1" alt="" width="2560" height="1440" decoding="async">
    </picture>
    <div class="contact-veil"></div>
    <canvas class="motes"></canvas>
  </div>

  <main class="page-main">
    <div class="contact-stage">
      <div class="contact-print">
        <div class="contact-print-mat" aria-hidden="true"></div>
        <span class="photo-corner photo-corner-tl" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-tr" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-bl" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-br" aria-hidden="true"></span>
        <div class="contact-print-body">
          <picture class="contact-crest" aria-hidden="true"><source type="image/webp" srcset="assets/brand/g4/mark-256.webp"><img class="contact-crest-img" src="assets/brand/g4/mark-256.png" alt="" width="176" height="256" draggable="false"></picture>
          <h1>Contact</h1>
          <p class="contact-lede">I&rsquo;d love to hear from you. Write a note below and I&rsquo;ll get back to you.</p>
          <form class="contact-form" action="https://formsubmit.co/contact@lanternandleavesphotography.com" method="POST">
            <input type="hidden" name="_subject" value="New message from Lantern &amp; Leaves Photography">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://lanternandleavesphotography.com/thanks.html">
            <input type="text" name="_honey" style="display:none" autocomplete="off" tabindex="-1" aria-hidden="true">

            <p class="contact-field">
              <label for="contact-name">Name</label>
              <input id="contact-name" name="name" type="text" autocomplete="name" required>
            </p>
            <p class="contact-field">
              <label for="contact-email">Email</label>
              <input id="contact-email" name="email" type="email" autocomplete="email" required>
            </p>
            <p class="contact-field contact-field-message">
              <label for="contact-message">Comments</label>
              <textarea id="contact-message" name="message" rows="8" required></textarea>
            </p>
            <div class="contact-send">
              <div class="zf-camera-send">
                <picture>
                  <source srcset="images/backgrounds/nikon-zf-top.webp?v=1" type="image/webp">
                  <img class="zf-camera-img" src="images/backgrounds/nikon-zf-top.png?v=1" width="1251" height="485" alt="" draggable="false" decoding="async">
                </picture>
                <button type="submit" class="zf-shutter-hotspot" aria-label="Send message — press Nikon Zf shutter"><span class="zf-cap" aria-hidden="true"></span></button>
              </div>
              <p class="zf-send-label" aria-hidden="true">
                <span>Click shutter to send</span>
                <svg class="zf-ink-arrow" viewBox="0 0 40 28" focusable="false"><path d="M3 24 C 12 25, 24 20, 33 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M26.5 7.5 L33.6 5.2 L34.2 12.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <picture class="footer-lockup-pic"><source type="image/webp" srcset="assets/brand/g4-fonts/lockup-dark-horizontal-480.webp 480w, assets/brand/g4-fonts/lockup-dark-horizontal-720.webp 720w" sizes="(max-width: 560px) 229px, 274px"><img class="footer-lockup" src="assets/brand/g4-fonts/lockup-dark-horizontal-480.png" alt="" width="480" height="210" loading="lazy"></picture>
    <p class="visually-hidden">Lantern &amp; Leaves Photography</p>
  </footer>
  <script src="js/forest.js" defer></script>
  <script src="js/contact-shutter.js" defer></script>
</body>
</html>
