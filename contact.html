<body class="contact-page">

  <div class="contact-bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 700px)" type="image/webp" srcset="images/backgrounds/contact-forest-autumn-portrait.webp?v=1">
      <source media="(max-width: 700px)" srcset="images/backgrounds/contact-forest-autumn-portrait.jpg?v=1">

    </picture>
    <div class="contact-veil"></div>
    <canvas class="motes"></canvas>
  </div>

  <main class="page-main">
    <div class="contact-stage">
      <div class="contact-print">
        <div class="contact-print-mat" aria-hidden="true"></div>
        <span class="photo-corner photo-corner-tl" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-tr" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-bl" aria-hidden="true"></span>
        <span class="photo-corner photo-corner-br" aria-hidden="true"></span>
        <div class="contact-print-body">
          <h1>Contact</h1>
          <p class="contact-lede">I&rsquo;d love to hear from you. Write a note below and I&rsquo;ll get back to you.</p>
          <form class="contact-form" action="https://formsubmit.co/contact@lanternandleavesphotography.com" method="POST">
            <input type="hidden" name="_subject" value="New message from Lantern &amp; Leaves Photography">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_next" value="https://lanternandleavesphotography.com/thanks.html">
            <input type="text" name="_honey" style="display:none" autocomplete="off" tabindex="-1" aria-hidden="true">

            <p class="contact-field">
              <label for="contact-name">Name</label>
              <input id="contact-name" name="name" type="text" autocomplete="name" required>
            </p>
            <p class="contact-field">
              <label for="contact-email">Email</label>
              <input id="contact-email" name="email" type="email" autocomplete="email" required>
            </p>
            <p class="contact-field contact-field-message">
              <label for="contact-message">Comments</label>
              <textarea id="contact-message" name="message" rows="8" required></textarea>
            </p>
            <div class="contact-send">
              <button type="submit" class="shutter-submit" aria-label="Click shutter to send">
                <span class="shutter-iris zf-release" aria-hidden="true">
                  <svg viewBox="0 0 100 112" focusable="false">
                    <defs>
                      <radialGradient id="zf-collar" cx="36%" cy="30%" r="74%">
                        <stop offset="0%" stop-color="#3c3c40"/>
                        <stop offset="32%" stop-color="#1c1c1f"/>
                        <stop offset="68%" stop-color="#0c0c0e"/>
                        <stop offset="100%" stop-color="#050506"/>
                      </radialGradient>
                      <radialGradient id="zf-collar-sheen" cx="34%" cy="28%" r="68%">
                        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
                        <stop offset="30%" stop-color="#ffffff" stop-opacity="0.07"/>
                        <stop offset="58%" stop-color="#ffffff" stop-opacity="0"/>
                        <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
                      </radialGradient>
                      <linearGradient id="zf-flat" x1="18%" y1="10%" x2="84%" y2="90%">
                        <stop offset="0%" stop-color="#efede8"/>
                        <stop offset="28%" stop-color="#d5d3cd"/>
                        <stop offset="55%" stop-color="#c0beb8"/>
                        <stop offset="78%" stop-color="#b3b1ab"/>
                        <stop offset="100%" stop-color="#c8c6c0"/>
                      </linearGradient>
                      <linearGradient id="zf-chamfer" x1="22%" y1="12%" x2="80%" y2="88%">
                        <stop offset="0%" stop-color="#f6f4ef"/>
                        <stop offset="38%" stop-color="#cfcbc4"/>
                        <stop offset="70%" stop-color="#8e8c86"/>
                        <stop offset="100%" stop-color="#6a6862"/>
                      </linearGradient>
                    </defs>
                    <g class="zf-collar">
                      <rect x="44.2" y="89.6" width="11.6" height="13.4" rx="3.1" ry="3.1" fill="url(#zf-collar)"/>
                      <rect x="44.2" y="89.6" width="11.6" height="13.4" rx="3.1" ry="3.1" fill="none" stroke="#0a0a0c" stroke-width="0.5"/>
                      <rect x="47.35" y="97.05" width="5.3" height="2.05" rx="0.45" fill="#cfcbc4"/>
                      <rect x="47.55" y="97.15" width="4.9" height="0.9" rx="0.35" fill="#f4f1ea"/>
                      <circle cx="50" cy="50" r="41.2" fill="url(#zf-collar)"/>
                      <circle cx="50" cy="50" r="41.2" fill="url(#zf-collar-sheen)"/>
                      <circle cx="50" cy="50" r="41.15" fill="none" stroke="#000000" stroke-width="0.85"/>
                      <circle cx="50" cy="50" r="40.35" fill="none" stroke="#8a8a90" stroke-width="0.55" opacity="0.42"/>
                      <circle cx="50" cy="50" r="39.55" fill="none" stroke="#1a1a1c" stroke-width="0.4" opacity="0.7"/>
                      <circle cx="50" cy="50" r="36.4" fill="none" stroke="#2a2a2e" stroke-width="1.8"/>
                      <circle cx="50" cy="50" r="35.45" fill="none" stroke="#9a9aa0" stroke-width="0.45" opacity="0.4"/>
                      <circle cx="50" cy="50" r="34.85" fill="#0a0a0c"/>
                      <ellipse class="zf-well-shadow" cx="50.4" cy="51.4" rx="33.6" ry="33.6" fill="#000000"/>
                    </g>
                    <g class="zf-plunger">
                      <circle cx="50" cy="50" r="33.35" fill="url(#zf-chamfer)"/>
                      <circle cx="50" cy="50" r="33.35" fill="none" stroke="#2a2a28" stroke-width="0.45"/>
                      <circle cx="50" cy="50" r="31.85" fill="url(#zf-flat)"/>
                      <circle cx="50" cy="50" r="31.85" fill="none" stroke="#d8d6d0" stroke-width="0.35" opacity="0.55"/>
                      <circle cx="50" cy="50" r="31.35" fill="none" stroke="#8a8882" stroke-width="0.22" opacity="0.35"/>
                      <circle cx="50" cy="50" r="29.2" fill="none" stroke="#9a9892" stroke-width="0.18" opacity="0.22"/>
                      <circle cx="50" cy="50" r="27.0" fill="none" stroke="#e4e2dc" stroke-width="0.16" opacity="0.2"/>
                      <circle cx="50" cy="50" r="24.8" fill="none" stroke="#8e8c86" stroke-width="0.16" opacity="0.2"/>
                      <circle cx="50" cy="50" r="22.6" fill="none" stroke="#dedcd6" stroke-width="0.15" opacity="0.18"/>
                      <circle cx="50" cy="50" r="20.4" fill="none" stroke="#908e88" stroke-width="0.15" opacity="0.18"/>
                      <circle cx="50" cy="50" r="18.2" fill="none" stroke="#e0ded8" stroke-width="0.14" opacity="0.16"/>
                      <circle cx="50" cy="50" r="16.0" fill="none" stroke="#8c8a84" stroke-width="0.14" opacity="0.16"/>
                      <circle cx="50" cy="50" r="13.8" fill="none" stroke="#e2e0da" stroke-width="0.13" opacity="0.14"/>
                      <circle cx="50" cy="50" r="11.6" fill="none" stroke="#8e8c86" stroke-width="0.13" opacity="0.14"/>
                      <circle cx="50" cy="50" r="9.4" fill="none" stroke="#e0ded8" stroke-width="0.12" opacity="0.12"/>
                      <circle cx="50" cy="50" r="7.2" fill="none" stroke="#908e88" stroke-width="0.12" opacity="0.12"/>
                      <circle cx="50" cy="50" r="5.0" fill="none" stroke="#dedcd6" stroke-width="0.11" opacity="0.1"/>
                      <circle cx="50" cy="50" r="2.8" fill="none" stroke="#8c8a84" stroke-width="0.11" opacity="0.1"/>
                    </g>
                  </svg>
                </span>
                <span class="shutter-text">Click shutter to send</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">

    <p>Lantern &amp; Leaves Photography</p>
